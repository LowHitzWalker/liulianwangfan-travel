<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
}

.hero{
height:100vh;
background:url('banner.png') center/cover;
display:flex;
align-items:center;
padding:80px;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
backdrop-filter:blur(2px);
}

.hero-content{
position:relative;
max-width:600px;
z-index:2;
}

.hero h1{
font-size:70px;
color:#d87c91;
margin-bottom:20px;
}

.hero p{
font-size:22px;
margin-bottom:15px;
letter-spacing:2px;
}

.hero small{
display:block;
font-size:16px;
margin-bottom:35px;
color:#666;
}

.btn{
display:inline-block;
padding:14px 30px;
background:#d87c91;
color:#fff;
text-decoration:none;
border-radius:40px;
margin-right:15px;
font-size:16px;
}

.section{
padding:80px 10%;
}

.section-title{
font-size:40px;
margin-bottom:40px;
color:#d87c91;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-content h3{
margin-bottom:10px;
}

.footer{
padding:50px 10%;
background:#fafafa;
text-align:center;
}

.footer h2{
margin-bottom:20px;
color:#d87c91;
}

.footer p{
margin:10px 0;
}

@media(max-width:768px){

.hero{
padding:40px;
}

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

}
.social-box{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.social-card{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
transition:0.3s;
}

.social-card:hover{
transform:translateY(-5px);
}

.social-card h3{
margin-bottom:10px;
font-size:22px;
}

.social-card p{
opacity:0.8;
}
</style>

</head>

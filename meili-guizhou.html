<title>魅力贵州｜刘连忘返</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
line-height:1.8;
}

.hero{
height:75vh;
background:url('banner.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:60px;

}

.hero p{
font-size:24px;
}

.section{
padding:80px 10%;
}

.title{
font-size:42px;
margin-bottom:35px;
color:#d87c91;
}

.content{
max-width:1000px;
margin:auto;
font-size:20px;
}

.highlight{
margin-top:50px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.box{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.box h3{
margin-bottom:15px;
font-size:28px;
}

.btn{
display:inline-block;
margin-top:50px;
padding:16px 32px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:50px;
}

@media(max-width:768px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.section{
padding:60px 7%;
}

.title{
font-size:32px;
}

.content{

}

}

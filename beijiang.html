<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北疆专区｜刘连忘返</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#fff;color:#333;}

.hero{
height:60vh;
background:url('beijiang.jpg') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.38);
}

.hero-content{position:relative;z-index:2;}

.hero h1{
font-size:60px;
color:#d87c91;
margin-bottom:15px;
}

.hero p{font-size:22px;}

.section{padding:80px 10%;}

.section-title{
font-size:40px;
margin-bottom:40px;
color:#d87c91;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{transform:translateY(-5px);}

.card h3{
font-size:28px;
margin-bottom:15px;
}

.card a{
text-decoration:none;
color:#333;
}

.card p{line-height:1.8;}

.btn{
display:inline-block;
margin-top:50px;
padding:15px 30px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:50px;
}

@media(max-width:768px){
.hero h1{font-size:40px;}
.hero p{font-size:18px;}
.section{padding:60px 7%;}
.section-title{font-size:30px;}
.cards{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<section class="hero">
<div class="hero-content">
<h1>北疆专区</h1>
<p>雪山草原 · 湖泊森林 · 四季秘境</p>
</div>
</section>

<section class="section">

<h2 class="section-title">选择北疆路线</h2>

<div class="cards">

<div class="card">
<h3><a href="damei-xinjiang.html">🏔 大美新疆</a></h3>
<p>辽阔山河｜草原湖泊｜新疆经典风光</p>
</div>

<div class="card">
<h3><a href="snow-beijiang.html">❄️ 北疆雪原秘境</a></h3>
<p>雪景森林｜童话村落｜冬日北疆</p>
</div>

<div class="card">
<h3><a href="xinxiang-beijiang.html">🍂 心向北疆</a></h3>
<p>喀纳斯｜禾木｜赛里木湖｜秋色秘境</p>
</div>

<div class="card">
<h3><a href="icefire-beijiang.html">🔥 北疆冰与火</a></h3>
<p>冰雪湖泊｜荒漠地貌｜反差大片感</p>
</div>

</div>

<a href="china.html" class="btn">返回中国专区</a>

</section>

</body>
</html>

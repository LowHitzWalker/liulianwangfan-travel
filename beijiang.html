<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>北疆雪原秘境</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
line-height:1.7;
}

.hero{
height:80vh;
background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop') center/cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,0.35);
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
color:white;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
}

.section{
padding:80px 10%;
}

.title{
font-size:40px;
margin-bottom:30px;
color:#d87c91;
}

.highlight-box{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
margin-top:40px;
}

.highlight{
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.highlight h3{
margin-bottom:15px;
}

.btn{
display:inline-block;
padding:16px 30px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:50px;
margin-top:40px;
}

@media(max-width:768px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.title{
font-size:30px;
}

}

</style>

</head>

<body>

<section class="hero">

<div class="hero-content">

<h1>北疆雪原秘境</h1>

<p>
12天10晚｜山河入怀 · 心向北疆
</p>

</div>

</section>

<section class="section">

<h2 class="title">行程亮点</h2>

<p>
穿越新疆最震撼的雪原风景，
感受北疆的辽阔、纯净与浪漫。

从喀纳斯到禾木，
一路雪山、森林、湖泊与童话村庄，
每一天都像电影场景。
</p>

<div class="highlight-box">

<div class="highlight">
<h3>🏔 喀纳斯</h3>
<p>神秘雪湖与森林秘境</p>
</div>

<div class="highlight">
<h3>🌲 禾木村</h3>
<p>童话雪国木屋村庄</p>
</div>

<div class="highlight">
<h3>❄ 赛里木湖</h3>
<p>蓝冰雪景与辽阔湖景</p>
</div>

<div class="highlight">
<h3>🛣 S21沙漠公路</h3>
<p>大片级荒漠风景公路</p>
</div>

</div>

立即咨询 WhatsApp
</a>

</section>

</html>

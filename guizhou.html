<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>贵州专区｜刘连忘返</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
}

.hero{
height:60vh;
background:url('banner.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.4);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:60px;
color:#d87c91;
margin-bottom:15px;
}

.hero p{
font-size:22px;
}

.section{
padding:80px 10%;
}

.section-title{
font-size:40px;
margin-bottom:40px;
color:#d87c91;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:15px;
font-size:28px;
}

.card p{
line-height:1.8;
}

.card a{
text-decoration:none;
color:#333;
}

.btn{
display:inline-block;
margin-top:50px;
padding:15px 30px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:50px;
}

@media(max-width:768px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.section{
padding:60px 7%;
}

.section-title{
font-size:30px;
}

.cards{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<h1>贵州专区</h1>

<p>山水秘境 · 花海人文</p>

</div>

</section>

<section class="section">

<h2 class="section-title">选择贵州路线</h2>

<div class="cards">

<div class="card">

<h3>
<a href="meili-guizhou.html">
🌸 2026｜魅力贵州
</a>
</h3>

<p>
黄果树｜苗寨｜梵净山｜古镇风情
</p>

</div>

<div class="card">

<h3>
<a href="huahai-guizhou.html">
🌿 2027｜山水花海
</a>
</h3>

<p>
油菜花海｜樱花｜山水秘境｜春日限定
</p>

</div>

</div>

<a href="china.html" class="btn">
返回中国专区
</a>

</section>

</body>
</html>

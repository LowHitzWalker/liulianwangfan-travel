<title>越南专区｜刘连忘返</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
}

.hero{
height:65vh;
background:url('banner.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:60px;
color:#d87c91;
margin-bottom:20px;
}

.hero p{
font-size:22px;
}

.section{
padding:80px 10%;
}

.section-title{
font-size:42px;
margin-bottom:40px;
color:#d87c91;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:15px;
font-size:28px;
}

.card p{
line-height:1.8;
}

.card a{
text-decoration:none;
color:#333;
}

.btn{
display:inline-block;
margin-top:50px;
padding:15px 30px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:50px;
}

@media(max-width:768px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.section{
padding:60px 7%;
}

.section-title{
font-size:30px;
}

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国专区｜刘连忘返 Hitz Walker</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
}

.hero{
height:70vh;
background:url('banner.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:60px;
color:#d87c91;
margin-bottom:15px;
}

.hero p{
font-size:22px;
}

.section{
padding:80px 10%;
}

.section-title{
font-size:40px;
margin-bottom:40px;
color:#d87c91;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:22px;
}

.card-content h3{
margin-bottom:10px;
}

.card-content a{
text-decoration:none;
color:#333;
}

.btn{
display:inline-block;
margin-top:35px;
padding:14px 28px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:40px;
}

@media(max-width:768px){
.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.section{
padding:60px 7%;
}

.section-title{
font-size:30px;
}

.cards{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<section class="hero">
<div class="hero-content">
<h1>中国专区</h1>
<p>山河辽阔 · 一路皆风景</p>
</div>
</section>

<section class="section">

<h2 class="section-title">选择你想去的中国路线</h2>

<div class="cards">

<div class="card">
<img src="beijiang.jpg">
<div class="card-content">
<h3><a href="beijiang.html">北疆</a></h3>
<p>雪山草原｜喀纳斯｜禾木｜赛里木湖</p>
</div>
</div>

<div class="card">
<img src="harbin.jpg">
<div class="card-content">
<h3><a href="harbin.html">哈尔滨</a></h3>
<p>雪乡童话｜冰雪大世界｜长白山</p>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1974&auto=format&fit=crop">
<div class="card-content">
<h3>重庆</h3>
<p>山城夜景｜洪崖洞｜魔幻都市</p>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1974&auto=format&fit=crop">
<div class="card-content">
<h3>云南</h3>
<p>大理丽江｜香格里拉｜四季风光</p>
</div>
</div>

</div>

<a href="index.html" class="btn">返回首页</a>

</section>

</body>
</html>

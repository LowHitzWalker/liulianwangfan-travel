<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国专区｜刘连忘返 Hitz Walker</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff;
color:#333;
}

.hero{
height:70vh;
background:url('banner.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:60px;
color:#d87c91;
margin-bottom:15px;
}

.hero p{
font-size:22px;
}

.section{
padding:80px 10%;
}

.section-title{
font-size:40px;
margin-bottom:40px;
color:#d87c91;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.card{min-height:160px;
display:flex;
align-items:center;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:22px;
}

.card-content h3{
margin-bottom:10px;
}

.card-content a{
text-decoration:none;
color:#333;
}

.btn{
display:inline-block;
margin-top:35px;
padding:14px 28px;
background:#d87c91;
color:white;
text-decoration:none;
border-radius:40px;
}

@media(max-width:768px){
.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

.section{
padding:60px 7%;
}

.section-title{
font-size:30px;
}

.cards{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<section class="hero">
<div class="hero-content">
<h1>中国专区</h1>
<p>山河辽阔 · 一路皆风景</p>
</div>
</section>

<section class="section">

<div class="cards">

<div class="cards">

</div>
</div>

<div class="card">
<div class="card-content">

</div>
</div>

<div class="card">
<div class="card-content">

<p>洪崖洞｜山城夜景｜魔幻都市</p>
</div>
</div>

<div class="card">
<div class="card-content">

</div>
</div>

<div class="card">

🌸 贵州

</h3>
<p>黄果树｜苗寨｜梵净山</p>
</div>
</div>

<p>阳朔｜漓江｜山水风光</p>

</div>

</div>
<a href="index.html" class="btn">返回首页</a>

</section>

</html>
